[package]
name = "indox-sdk"
version = "0.1.0"
edition = "2021"
description = "Official Indox API v1 SDK for Rust (thin helper; see generated/ for OpenAPI client)"
license-file = "../../LICENSE"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
thiserror = "1"
