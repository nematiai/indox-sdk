site_name: indox Developer Docs
site_description: Public API, SDK, and integration documentation for indox.org
site_url: https://indox.org/en-US/developers/
repo_url: https://github.com/indox-org/indox
edit_uri: edit/production/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  # Custom partials live in docs/overrides/ — used for the
  # "← Back to indox" announce bar so users don't feel stranded in docs.
  # NOTE: custom_dir resolves relative to mkdocs.yml, not docs_dir.
  custom_dir: docs/overrides
  # 'custom' palette — actual brand colors live in docs/stylesheets/indox.css
  # so we can match indox's navy theme exactly (not stock Material indigo).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss              # the "Back to indox" bar can be dismissed
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/indox.css

plugins:
  - search
  - awesome-pages
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  # Hide the "Made with Material for MkDocs" footer credit.
  generator: false
  # No social icons in the footer — keep it clean / on-brand.

  # ── App back-links rendered in the announce bar (docs/overrides/main.html).
  # Locale prefix MUST match the frontend's next-intl default locale so users
  # don't bounce through a redirect on the way "back".
  #
  # base_url is intentionally EMPTY → relative URLs. Same host serves both
  # frontend and docs, so /en-US/dashboard/ resolves to the current host
  # (localhost:8080 in dev, indox.org in prod). If the docs ever move to a
  # subdomain like docs.indox.org, set base_url: https://indox.org here.
  indox_app:
    base_url:      ""                 # relative URLs — same host serves docs + app
    locale_prefix: /en-US
    # 3 roles on the announce bar:
    #   back  → small left-aligned "← {label}" link to the app home
    #   links → secondary text links (middle, optional)
    #   cta   → primary right-aligned button — meant to convert readers
    back:
      label: Back to indox
      path: /                         # → /en-US/
    links:
      - label: Tools
        path: /tools/
    cta:
      label: Open Dashboard
      path: /dashboard/               # → /en-US/dashboard/

copyright: Copyright &copy; indox.org

# Fail the build on broken internal links and missing nav references.
strict: false   # flip to true once content stabilizes
