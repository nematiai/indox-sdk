[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indox-sdk"
version = "0.1.0"
description = "Indox SDK workspace — Python client, tools, and Colab convert tests."
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [{ name = "Indox", email = "support@indox.org" }]
dependencies = [
    # Local Python SDK (path dep). For editable: pip install -e ./languages/python
    "indox-client @ file:./languages/python",
    "tqdm>=4.66",
    "pillow>=10.0",
    "fonttools>=4.50",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = []
